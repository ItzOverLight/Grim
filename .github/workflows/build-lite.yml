name: Build Lite (no PacketEvents shaded)

on:
  push:                          # ← this fires on every sync / push to the default branch
    branches: [ "2.0", "main", "master" ]   # put your real default branch here
  workflow_dispatch:             # still allows manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # change to 25 if needed
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build lite jar
        env:
          SHADE_PE: false
        run: ./gradlew build -PshadePE=false --no-daemon

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimac-bukkit-lite
          path: bukkit/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Fabric artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: grimac-fabric-lite
          path: fabric/build/libs/*.jar
          if-no-files-found: warn
